<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Felhasználók Kezelése - Admin Panel</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="toast-container"></div>

    <div class="admin-layout app-layout">
        <main class="admin-main">
            <header class="admin-header">
                <h1>Felhasználók Kezelése</h1>
            </header>

            <div id="admin-content" style="display: none;">
                <div style="margin-bottom: 20px;">
                    <input type="text" id="user-search-input" placeholder="Keresés név vagy email alapján...">
                </div>

                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Név</th>
                                <th>Email</th>
                                <th>Szerepkör</th>
                                <th>Művelet</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Include Firebase & Utilities -->
    <script src="/__/firebase/10.13.0/firebase-app-compat.js"></script>
    <script src="/__/firebase/10.13.0/firebase-auth-compat.js"></script>
    <script src="/__/firebase/10.13.0/firebase-firestore-compat.js"></script>
    <script src="/__/firebase/init.js"></script>
    <script src="/firebase-emulators.js"></script>
    <script src="/toast.js"></script>
    <script src="/app.js"></script>
    <script src="/admin/users/users.js"></script>
</body>
</html>
