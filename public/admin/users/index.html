<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Felhasználók Kezelése - Admin Panel</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="toast-container"></div>

    <div class="admin-layout">
        <!-- Sidebar dynamically injected here by sidebar.js -->
        
        <main class="admin-main">
            <header class="admin-header">
                <h1>Felhasználók Kezelése</h1>
            </header>

            <div id="loading-msg">Betöltés...</div>

            <div id="admin-content" style="display: none;">
                <div style="margin-bottom: 20px;">
                    <input type="text" id="user-search-input" placeholder="Keresés név vagy email alapján...">
                </div>

                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Név</th>
                                <th>Email</th>
                                <th>Szerepkör</th>
                                <th>Művelet</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Include Firebase & Utilities -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="/toast.js"></script>
    <script src="/admin/sidebar.js"></script>
    <script src="/admin/users/users.js"></script>
</body>
</html>
