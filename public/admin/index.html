<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Konzol - EduBalance</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="/style.css">
    <script src="/toast.js"></script>
</head>
<body>
    <div id="toast-container"></div>

    <div class="admin-layout app-layout">
        <main class="admin-main">
            <header class="admin-header">
                <h1>Admin Konzol</h1>
            </header>

            <section id="admin-content" style="display: none;">
                <section class="admin-subpages" aria-labelledby="admin-subpages-heading">
                    <h2 id="admin-subpages-heading">Admin oldalak</h2>
                    <a class="admin-subpage-card" href="/admin/users/">
                        <span class="admin-subpage-card-title">Felhasználók</span>
                        <span class="admin-subpage-card-description">Felhasználók és szerepkörök kezelése</span>
                        <span class="admin-subpage-card-arrow" aria-hidden="true">→</span>
                    </a>
                </section>
            </section>
        </main>
    </div>

    <script src="/__/firebase/10.13.0/firebase-app-compat.js"></script>
    <script src="/__/firebase/10.13.0/firebase-auth-compat.js"></script>
    <script src="/__/firebase/10.13.0/firebase-firestore-compat.js"></script>
    <script src="/__/firebase/init.js"></script>
    <script src="/firebase-emulators.js"></script>
    <script src="/app.js"></script>
    <script src="/admin/script.js"></script>
</body>
</html>
